<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>查房助手</title>
<style>
:root{
  --bg:#f6f6f7; --card:#fff; --text:#111; --muted:#86868b; --faint:#b4b4b9; --line:#ececee;
  --accent:#0a7cff; --accent-soft:#e8f1ff; --red:#e5372b; --blue:#0a7cff; --amber:#c27400; --green:#1f9d55; --chip:#f1f1f3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#151516; --text:#f2f2f4; --muted:#8e8e93; --faint:#55555a; --line:#262628;
    --accent:#3d9bff; --accent-soft:#132640; --red:#ff5a4f; --blue:#5aa8ff; --amber:#f0a73a; --green:#34c26b; --chip:#232325;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(58px + env(safe-area-inset-bottom));min-height:100vh;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 6px;display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.ib{border:0;background:none;padding:6px;color:var(--accent);cursor:pointer;display:flex;align-items:center;font-size:15px}
.ib:disabled{opacity:.25}
.wrap{padding:4px 12px 24px}
/* week strip */
.cal{background:var(--bg);position:sticky;top:44px;z-index:4;padding:0 0 6px}
.calhead{display:flex;align-items:center;padding:0 16px 2px;font-size:13px;color:var(--muted);gap:8px}
.calhead .m{position:relative;flex:1}
.calhead input{position:absolute;inset:0;opacity:0;width:100%}
.calhead button{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 0;cursor:pointer}
.weeks{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.week{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px}
.day{border:0;background:none;padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.day .w{font-size:10px;color:var(--muted)}
.day .n{font-size:15px;width:30px;height:30px;line-height:30px;border-radius:50%;text-align:center}
.day.today .n{color:var(--accent);font-weight:600}
.day.sel .n{background:var(--text);color:var(--bg);font-weight:600}
.dot{width:5px;height:5px;border-radius:50%;background:transparent;display:inline-block}
.dot.on{background:var(--muted)} .dot.ok{background:var(--green)} .dot.pend{background:var(--amber)} .dot.late{background:var(--red)}
/* month grid (surgery tab) */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 10px 4px}
.mhead b{font-weight:600;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;gap:2px}
.mgrid .wh{font-size:10px;color:var(--muted);text-align:center;padding:2px 0}
.mcell{border:0;background:none;border-radius:10px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:46px;cursor:pointer}
.mcell .n{font-size:14px}
.mcell.out .n{color:var(--faint)}
.mcell.today .n{color:var(--accent);font-weight:600}
.mcell.sel{background:var(--text)} .mcell.sel .n{color:var(--bg);font-weight:600}
.mcell .c{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.mcell.sel .c{color:var(--bg)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button.on{border-color:var(--text);color:var(--text)}
.group{font-size:12px;color:var(--muted);padding:10px 4px 4px;letter-spacing:.02em}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.srow{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .act{position:absolute;top:0;right:0;bottom:0;width:84px;display:none}
.srow.sw .act{display:flex}
.srow .act button{flex:1;border:0;background:var(--red);color:#fff;font-size:14px}
.row{position:relative;background:var(--card);display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:transform .18s ease;touch-action:pan-y}
.row.drag{transition:none}
.who{flex:none;width:58px}
.who .b{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.who .nm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm.lab{color:var(--accent);font-weight:600}
.who .b.moved{color:var(--amber)}
.dx{flex:1;min-width:0;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dx.empty{color:var(--faint);font-size:13px}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pod{font-weight:600;color:var(--accent);font-size:14px;white-space:nowrap}
.mk{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.mk.lab{color:var(--accent);border-color:var(--accent)}
.remind{background:var(--card);border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.remind .h{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex}
.remind .h .sp{flex:1}
.remind .r{display:flex;gap:8px;padding:4px 0;font-size:14px;cursor:pointer;align-items:baseline}
.remind .r .b{font:600 13px ui-monospace,Menlo,monospace;width:52px;flex:none}
.remind .r.late{color:var(--red)}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 8px;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.card h2 .sp{flex:1}
.card h2 button{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 4px;cursor:pointer}
.big{font-size:18px;font-weight:600;line-height:1.35}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.idline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.sexsw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sexsw button{border:0;background:none;padding:1px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.sexsw button.on{background:var(--text);color:var(--bg)}
.hx{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.hx li{margin:3px 0}
.hx .tag{color:var(--red);font-weight:500}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:6px}
.kv b{font-weight:500;color:var(--muted);font-size:12px;margin-right:3px}
.st{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;font-size:14px;align-items:start}
.st .k{font-size:12px;color:var(--muted);padding-top:1px;cursor:pointer}
.st .v{cursor:pointer;min-width:0}
.st .v .none{color:var(--faint)}
.st .since{font-size:11px;color:var(--faint);margin-left:4px}
.st .cul{color:var(--red);font-weight:500}
.st .ex{display:flex;align-items:baseline;gap:6px}
.st .ex span{flex:1}
.st .ex button,.xbtn{border:0;background:none;color:var(--faint);font-size:16px;padding:0 4px;cursor:pointer}
.labs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
.lab{cursor:pointer}
.lab .k{font-size:11px;color:var(--muted)}
.lab .v{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace}
.lab .v.H{color:var(--red)} .lab .v.L{color:var(--blue)} .lab .v.old{color:var(--faint);font-weight:400}
.lab .p{font-size:11px;color:var(--faint)}
table.io{width:100%;border-collapse:collapse;font-size:14px}
table.io th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:0 0 4px}
table.io th:first-child{text-align:left}
table.io td{padding:4px 0;border-top:1px solid var(--line);text-align:right;font-family:ui-monospace,Menlo,monospace;vertical-align:top}
table.io td:first-child{text-align:left;font-family:inherit}
table.io td.t{font-weight:600}
table.io .sub{display:block;font-size:11px;color:var(--muted);font-family:-apple-system,sans-serif}
.meds{margin:0;padding:0;list-style:none}
.meds li{display:flex;gap:6px;padding:3px 0;font-size:14px;border-bottom:1px solid var(--line)}
.meds li:last-child{border-bottom:0}
.meds .mn{flex:1}
.meds .mf{color:var(--muted);white-space:nowrap;font-size:13px}
.meds li.add .mn{font-weight:600}
.meds li.add .mn:after{content:" 新";font-size:10px;color:var(--accent);font-weight:500}
.meds li.chg .mf{color:var(--amber)}
.meds li.stop{color:var(--faint);text-decoration:line-through}
.own{font-size:10px;padding:0 4px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.opt{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button.on,.opt.on{border-color:var(--text);background:var(--text);color:var(--bg)}
.chips button.cur{border-color:var(--accent);color:var(--accent)}
.chips button:active{background:var(--chip)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:var(--chip);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.cats button.on{background:var(--text);color:var(--bg)}
.panel{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg)}
.panel .lbl{font-size:11px;color:var(--muted);margin:8px 0 4px}
.panel .lbl:first-child{margin-top:0}
.inl{display:flex;gap:6px;margin-top:6px}
.inl input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}
.addline{display:flex;gap:6px;margin-top:8px}
.addline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--text);color:var(--bg);font-weight:600;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);font-weight:500}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.todos{list-style:none;margin:8px 0 0;padding:0}
.todos li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.todos li.done span.t{color:var(--faint);text-decoration:line-through}
.todos input[type=checkbox],.chk input{width:20px;height:20px;accent-color:var(--text);flex:none}
.todos span.t{flex:1}
.todos .due{font-size:12px;color:var(--accent);border:0;background:none;padding:0 2px;cursor:pointer;white-space:nowrap}
.todos .due.none{color:var(--faint)}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chk:first-of-type{border-top:0}
.chk .when{font-size:11px;color:var(--faint);margin-left:auto}
.prog{font-size:12px;font-weight:600;white-space:nowrap}
.prog.ok{color:var(--green)} .prog.pend{color:var(--amber)} .prog.late{color:var(--red)}
.surg{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.surg:last-child{border-bottom:0}
.surg .room{font:600 13px ui-monospace,Menlo,monospace;width:40px;flex:none}
.surg .mid{flex:1;min-width:0}
.surg .mid .p{font-weight:600}
.surg .mid .s{font-size:12px;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;font-size:10px;color:var(--muted);text-decoration:none}
.tabbar a.on{color:var(--text)}
textarea.paste{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font:13px/1.4 ui-monospace,Menlo,monospace}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.hint{font-size:12px;color:var(--accent);margin-top:3px;min-height:16px}
.hint.bad{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.labform{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px}
.labform label{display:flex;align-items:center;gap:6px;font-size:13px}
.labform label span{width:42px;color:var(--muted)}
.labform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);font-family:ui-monospace,Menlo,monospace}
.iorow{border-top:1px solid var(--line);padding:8px 0}
.iorow .l1{display:flex;gap:6px;align-items:center}
.iorow input{border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:var(--bg);min-width:0}
.iorow input.n{flex:1.4} .iorow input.v{flex:1;width:0;font-family:ui-monospace,Menlo,monospace}
.iorow .cat{font-size:10px;color:var(--muted);width:34px;flex:none}
.iorow .tot{font:600 13px ui-monospace,Menlo,monospace;width:46px;text-align:right;flex:none}
.iorow .colors{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;padding-left:40px}
.iorow .colors button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 8px;font-size:12px}
.iorow .colors button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.iohead{display:flex;gap:6px;font-size:10px;color:var(--muted);padding-left:40px}
.iohead span{flex:1;text-align:center}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:16px;font-weight:600;display:flex;align-items:center}
.sheet h3 .sp{flex:1}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row2 .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:92vw;display:flex;gap:14px;align-items:center}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:none;color:#5aa8ff;font-weight:600;padding:0;flex:none}
.sum li{margin:2px 0}
table.hist{border-collapse:collapse;font-size:12px;width:100%}
table.hist th,table.hist td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.hist th{color:var(--accent);cursor:pointer}
table.hist th:first-child,table.hist td:first-child{text-align:left;color:inherit}
.H{color:var(--red)} .L{color:var(--blue)}
.histwrap{overflow-x:auto}
.empty-state{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{flex:1;min-width:64px}
code{font-size:12px;background:var(--chip);padding:1px 4px;border-radius:4px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.lrow:first-of-type{border-top:0}
.lrow .grow{flex:1;min-width:0}

.wdsel button{border:1px solid var(--line);background:none;border-radius:6px;width:28px;height:28px;font-size:12px;padding:0}
.wdsel button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.warnbox{font-size:12px;color:var(--red);margin-top:4px}

<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<script src="core.js"></script>
<script>
'use strict';
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm';
const MODEL = 'claude-opus-5-5';

S = loadState();
let selDate = today();           // patient list date
let orSel = today();             // surgery tab selected date
let orMonth = today().slice(0,7);
let orderUI = {mrn:null, cat:null};
let monthAsked = false;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// ---------- helpers ----------
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function save(){ if(!saveState()){ toast('儲存失敗，手機空間可能不足'); return false; } return true; }
function toast(msg, action){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');
  if(action) t.querySelector('button').onclick = () => { action.fn(); t.remove(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), action ? 5000 : 2400);
}
// Every change worth undoing goes through act(): snapshot, change, save, re-render, offer "復原".
const UNDO = [];
function act(label, fn, opts){
  const before = JSON.stringify(S);
  const r = fn();
  save();
  UNDO.unshift({label, before, at:new Date()}); if(UNDO.length > 20) UNDO.pop();
  render();
  if(!opts || opts.toast !== false) toast(label, {label:'復原', fn:() => undoAt(0)});
  return r;
}
function undoAt(i){
  const u = UNDO[i]; if(!u) return;
  document.querySelectorAll('.sheetbg').forEach(s => s.remove());
  S = migrate(JSON.parse(u.before)); UNDO.splice(0, i + 1); save(); render(); toast('已復原：' + u.label);
}

// ---------- Claude ----------
let _Anthropic;
async function askClaude(content, schema, system){
  const key = S.settings.apiKey;
  if(!key) throw new Error('請先到「設定」輸入 Claude API key');
  if(!_Anthropic) _Anthropic = (await import(SDK_URL)).default;
  const client = new _Anthropic({apiKey:key, dangerouslyAllowBrowser:true});
  let res;
  try{ res = await client.beta.messages.create({
    model: MODEL, max_tokens: 8000,
    betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
    system,
    output_config: {effort:'low', format:{type:'json_schema', schema}},
    messages: [{role:'user', content}]
  }); }
  catch(err){
    if(err.status === 401) throw new Error('API key 無效，請到「設定」重新輸入');
    if(err.status === 429) throw new Error('請求太頻繁，稍等一下再試');
    if(err.status === 400 && /credit/i.test(err.message)) throw new Error('API 帳戶餘額不足');
    throw err;
  }
  if(res.stop_reason === 'refusal') throw new Error('Claude 無法處理這份內容');
  return JSON.parse(res.content.filter(b => b.type === 'text').map(b => b.text).join(''));
}
async function fileToB64(file){
  const img = await createImageBitmap(file);
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');

const ORG_SYSTEM = `你幫一位台灣泌尿科住院醫師整理他自己打的病人重點筆記（中英夾雜）。把每位病人的文字分類到欄位，保留他原本的寫法，不要翻譯、不要改寫醫學內容、不要補充沒寫的資訊。

- short：手機清單用的精簡版，最多約 20 個字元，格式「側別 + 疾病或術式 + 計數」，依病人來源：
  手術：術式，例如 Lt RAPN、RARP、TURBT（POD 由 App 計算，不要寫進 short）
  化療／標靶／免疫：癌別 · 療程 C#D#，例如 Bladder UC · GC C3D1、mCRPC · Docetaxel C2D1
  急診感染：診斷 + Abx，例如 Lt APN urosepsis Abx（天數由 App 計算，寫 Abx 就好）
  急診阻塞／出血：AUR · post Foley、Clot retention · CBI、Lt UV stone · s/p DJ 10/29
  新診斷 staging：New Bladder UC · staging
  他寫了「簡稱 | 完整診斷」時，簡稱就是 short。
- opDate：手術日 YYYY-MM-DD。寫「POD n」就用今天日期減 n 天；寫「OP 11/5」就換算；沒寫就 null。
- sex：文中寫 70F、M、F 等才填，否則 null。

- note：其他無法分類的內容，保留原文換行；沒有就 null。
key 照輸入原樣回傳。`;
async function organizeNotes(items){
  const payload = `今天是 ${today()}。\n\n` + items.map(i => `=== key: ${i.key} ===\n${i.text}`).join('\n\n');
  const res = await askClaude([{type:'text', text:payload}], ORG_SCHEMA, ORG_SYSTEM);
  const out = {};
  for(const r of res.patients || []){
    const o = {};
    for(const k of ['short','dx','opDate','ipsa','pv','mri','note','sex']) if(has(r[k])) o[k] = String(r[k]).trim();
    if(o.dx) o.dx = stripHash(o.dx);
    if(o.short) o.short = stripHash(o.short);
    if(o.opDate && !/^\d{4}-\d{2}-\d{2}$/.test(o.opDate)) delete o.opDate;
    if(r.hx && r.hx.length) o.hx = r.hx.map(s => s.trim()).filter(Boolean);
    o.anti = (r.anti || []).map(a => ({drug:a.drug, holdDays:a.holdDays}));
    o.exams = (r.exams || []).map(e => ({id:uid(), text:e.text, date:e.date}));
    o.cultures = r.cultures || [];
    const cyc = parseCycle(o.short || o.dx, today()); if(cyc) o.cycle = cyc;
    out[r.key] = o;
  }
  return out;
}

let openRow = null;
function closeRow(row){ row.style.transform = ''; setTimeout(() => { if(!row.style.transform) row.parentElement.classList.remove('sw'); }, 200); }
function bindSwipe(){
  document.querySelectorAll('.srow .row').forEach(row => {
    let x0 = 0, y0 = 0, dx = 0, mode = null;
    row.addEventListener('touchstart', e => {
      if(openRow && openRow !== row){ closeRow(openRow); openRow = null; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null;
    }, {passive:true});
    row.addEventListener('touchmove', e => {
      const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if(!mode) mode = Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) ? 'h' : (Math.abs(my) > 8 ? 'v' : null);
      if(mode !== 'h') return;
      e.preventDefault();
      const base = openRow === row ? -84 : 0;
      dx = Math.min(0, Math.max(-120, base + mx));
      row.parentElement.classList.add('sw'); row.classList.add('drag'); row.style.transform = `translateX(${dx}px)`;
    }, {passive:false});
    row.addEventListener('touchend', () => {
      row.classList.remove('drag');
      if(mode !== 'h') return;
      row.dataset.swiped = '1'; setTimeout(() => delete row.dataset.swiped, 300);
      if(dx < -42){ row.style.transform = 'translateX(-84px)'; openRow = row; }
      else { closeRow(row); if(openRow === row) openRow = null; }
    });
  });
}

  $('#app').oninput = e => { if(e.target.matches('[data-ivfrate]')) orderUI.ivfRate = e.target.value; };
}

      const {cur, prev} = latestLab(p, k);
      if(!cur) return `<div class="lab" data-labedit="${lastDate}"><div class="k">${label}</div><div class="v old">—</div></div>`;
      const old = cur.d !== lastDate;
      return `<div class="lab" data-labedit="${cur.d}"><div class="k">${label}${old?` <span class="faint">${md(cur.d)}</span>`:''}</div>
        <div class="v ${old?'old':flag(cur.v,lo,hi)}">${fmtNum(cur.v)}${arrow(cur.v, prev&&prev.v)}</div>
        ${prev&&!old?`<div class="p">${fmtNum(prev.v)}</div>`:''}</div>`;
    }).join('') + '</div></div>';

  orders(p, d){
    const cats = [['diet','飲食'],['ivf','IVF'],['lab','Lab'],['exam','檢查'],['tube','管路'],['drug','藥物'],['consult','會診'],['dc','出院']];
    const todos = (p.todos||[]).filter(x => !x.done || x.doneOn === d)
      .sort((a,b) => (a.done - b.done) || (a.due||'9').localeCompare(b.due||'9'));
    return `<div class="card" id="orders"><h2>Order</h2>
      <div class="cats">${cats.map(([k,l]) => `<button data-ocat="${k}" class="${orderUI.cat===k?'on':''}">${l}</button>`).join('')}</div>
      ${orderUI.cat ? `<div class="panel">${orderPanel(p, d)}</div>` : ''}
      <form class="addline" data-form="todo"><input name="t" placeholder="其他 order（可用麥克風口述）" autocomplete="off" enterkeyhint="done"><button class="btn sm">加入</button></form>
      ${todos.length ? `<ul class="todos">${todos.map(x => `<li class="${x.done?'done':''}"><input type="checkbox" data-todo="${x.id}" ${x.done?'checked':''}><span class="t">${esc(x.t)}${x.d!==d&&!x.due?` <span class="faint small">${md(x.d)}</span>`:''}</span><button class="due ${x.due?'':'none'}" data-due="${x.id}">${x.due?`提醒 ${md(x.due)}`:'提醒'}</button><button class="xbtn" data-deltodo="${x.id}">×</button></li>`).join('')}</ul>` : ''}
    </div>`;
  },
  meds(p){
    if(!(p.meds||[]).length) return '';
    const diff = p.medDiff || {added:[], changed:[], stopped:[]};
    const open = S.settings.medsOpen;
    const changeNote = [diff.added.length?`新增 ${diff.added.length}`:'', diff.changed.length?`改 ${diff.changed.length}`:'', diff.stopped.length?`停 ${diff.stopped.length}`:''].filter(Boolean).join(' · ');
    let html = `<div class="card"><h2>用藥 ${p.meds.length} 項 ${p.medsDate?`<span class="faint">${md(p.medsDate)}</span>`:''}${changeNote?` · ${changeNote}`:''}<span class="sp"></span><button data-act="meds">${open?'收合':'展開'}</button></h2>`;
    if(open){
      html += '<ul class="meds">' + p.meds.map(m => {
        const k = m.n.toLowerCase();
        const cls = diff.added.includes(k) ? 'add' : diff.changed.includes(k) ? 'chg' : '';
        return `<li class="${cls}"><span class="mn">${esc(m.n)}${m.own?'<span class="own">自備</span>':''}</span><span class="mf">${esc(m.d)} ${esc(m.f)}</span></li>`;
      }).join('') + diff.stopped.map(m => `<li class="stop"><span class="mn">${esc(m.n)}</span><span class="mf">${esc(m.d)} ${esc(m.f)}</span></li>`).join('') + '</ul>';
    }
    return html + '</div>';
  }
};

    case 'ivf': {

    }
  }
  return '';
}
// Create an order: update status + add the todo, all undoable.
function placeOrder(p, kind, data, extra){
  orderUI.cat = null;   // back to the category row after each order
  const label = act('order', () => {
    const t = applyOrder(p, kind, data, selDate);
    addTodo(p, t, {d:selDate, kind, due:(extra && extra.due) || null});
    return t;
  }, {toast:false});
  toast('已加入：' + label, {label:'復原', fn:() => undoAt(0)});
}

function detailClick(e, p){
  const el = e.target.closest('[data-act],[data-ocat],[data-o],[data-ivft],[data-labset],[data-examt],[data-part],[data-contrast],[data-examself],[data-drugself],[data-dcmeds],[data-sex],[data-delexam],[data-chk],[data-iodate],[data-labedit]');
  if(!el) return;
  const u = orderUI, ds = el.dataset;
  const panelVal = sel => { const x = document.querySelector(sel); return x ? x.value.trim() : ''; };
  const keepPanelInputs = () => { u.examDate = panelVal('[data-examdate]'); u.examTime = panelVal('[data-examtime]'); u.examOther = panelVal('[data-examother]'); };
  if(ds.act){
    const a = ds.act;
    if(a === 'editdx') editPatient(p);
    if(a === 'paste') pastePatient(p);
    if(a === 'lab') labForm(p, today());
    if(a === 'labhist') labHistory(p);
    if(a === 'io') ioForm(p, today());
    if(a === 'ioedit') ioForm(p, ds.date);
    if(a === 'culture') cultureSheet(p);
    if(a === 'layout') layoutSheet();
    if(a === 'meds'){ S.settings.medsOpen = !S.settings.medsOpen; save(); render(); }
    if(a === 'purge' && confirm(`永久刪除 ${p.name || p.mrn} 的所有資料（包含過去住院紀錄）？`)) act(`已刪除 ${p.name || p.mrn}`, () => { delete S.patients[p.mrn]; location.hash = '#/'; });
    return;
  }
  if(ds.ocat){
    u.cat = u.cat === ds.ocat && el.closest('.cats') ? null : ds.ocat;
    render();
    if(!el.closest('.cats')){ const o = document.getElementById('orders'); if(o) o.scrollIntoView({behavior:'smooth', block:'start'}); }
    return;
  }
  if(ds.sex !== undefined){ p.sex = p.sex === ds.sex ? '' : ds.sex; save(); render(); return; }
  if(ds.delexam){ act('已移除檢查', () => { p.status.exams = p.status.exams.filter(x => x.id !== ds.delexam); }); return; }
  if(ds.chk){ const [sid, cid] = ds.chk.split(':'); const s = S.surgeries[sid]; if(s){ s.checks = s.checks || {}; s.checks[cid] = el.checked ? today() : null; save(); render(); } return; }
  if(ds.iodate !== undefined){ if(ds.iodate){ u.ioDate = ds.iodate; render(); } return; }
  if(ds.labedit){ labForm(p, ds.labedit); return; }
  if(ds.ivft){ u.ivfType = ds.ivft; render(); return; }
  if(ds.labset){ u.labSet = ds.labset; render(); return; }
  if(ds.examt){ keepPanelInputs(); u.exam = ds.examt; u.parts = []; u.contrast = false; render(); return; }
  if(ds.part){ keepPanelInputs(); u.parts = u.parts || []; u.parts = u.parts.includes(ds.part) ? u.parts.filter(x => x !== ds.part) : [...u.parts, ds.part]; render(); return; }
  if(el.hasAttribute('data-contrast')){ keepPanelInputs(); u.contrast = !u.contrast; render(); return; }
  if(el.hasAttribute('data-examself')){ keepPanelInputs(); u.self = !u.self; render(); return; }
  if(el.hasAttribute('data-drugself')){ const n = panelVal('[data-drugname]'); u.self = !u.self; render(); const x = document.querySelector('[data-drugname]'); if(x) x.value = n; return; }
  if(el.hasAttribute('data-dcmeds')){ dischargeMedsSheet(p); return; }
  const o = ds.o; if(!o) return;
  if(o === 'diet') return placeOrder(p, 'diet', {v:ds.v});
  if(o === 'ivf') return placeOrder(p, 'ivf', {v:ds.v});
  if(o === 'ivfcustom'){ const r = panelVal('[data-ivfrate]'); if(r) placeOrder(p, 'ivf', {v:`${ds.v} ${r}`}); return; }
  if(o === 'lab'){ const set = u.labSet || '全套'; return placeOrder(p, 'lab', {set, label:ds.label, due:ds.due}, {due:ds.due}); }
  if(o === 'exam'){
    keepPanelInputs();
    const ex = u.exam || 'CT';
    let name = ex === '其他' ? u.examOther : ex;
    if(!name) return toast('請輸入檢查名稱');
    if((ex === 'CT' || ex === 'MRI') && (u.parts||[]).length) name += ' ' + u.parts.join('') + (u.contrast ? '+C' : '');
    else if(u.contrast) name += ' +C';
    const when = [u.examDate ? md(u.examDate) : '', u.examTime].filter(Boolean).join(' ');
    const text = [name, u.self ? '自費' : '', when].filter(Boolean).join(' ');
    Object.assign(u, {parts:[], contrast:false, self:false, examDate:'', examTime:'', examOther:''});
    return placeOrder(p, 'exam', {text, date:panelVal('[data-examdate]') || null});
  }
  if(o === 'tubeOut') return placeOrder(p, o, {name:ds.v});
  if(o === 'tubeIn'){   // usually recording a tube already in place, so status only, no order
    u.cat = null;
    act(`已記錄管路 ${ds.v}`, () => applyOrder(p, 'tubeIn', {name:ds.v}, selDate));
    return;
  }
  if(o === 'drugAdd'){ const n = panelVal('[data-drugname]'); if(!n) return; const self = u.self; u.self = false; return placeOrder(p, 'drugAdd', {name:n, self}); }
  if(o === 'drugDC') return placeOrder(p, 'drugDC', {name:ds.v});
  if(o === 'consult') return placeOrder(p, 'consult', {dept:ds.v});
  if(o === 'consultother'){ const n = panelVal('[data-consultother]'); if(n) placeOrder(p, 'consult', {dept:n}); return; }
  if(o === 'mbd') return placeOrder(p, 'mbd', {date:ds.v});
  if(o === 'mbdpick') return pickDate('MBD 日期', addDays(today(), 1), v => placeOrder(p, 'mbd', {date:v}));
  if(o === 'rtc') return placeOrder(p, 'rtc', {date:ds.v});
  if(o === 'rtcpick') return pickDate('RTC 日期', addDays(today(), 7), v => placeOrder(p, 'rtc', {date:v}));
  if(o === 'text') return placeOrder(p, 'text', {text:ds.v});
}

      };

        if(isNew && !g('mrn') && !confirm('沒有病歷號：入院時無法自動合併 TeamPro 資料。仍要儲存？')) return;
        close();
        act(isNew ? `已新增 ${g('name') || g('mrn')}` : '已儲存', () => {

            if(q.adm && q.dischargedOn) archiveStay(q);
            const start = g('start') || base;
            if(start > today()) Object.assign(q, {planned:true, plannedAdm:start});
            else Object.assign(q, {planned:false, adm:q.adm || start, dischargedOn:null});
            linkSurgery(q);
          }
          for(const k of ['bed','name','attending','short','dx','hx','ipsa','pv','mri','note']) q[k] = g(k);
          q.opDate = opDate;
          q.short = stripHash(q.short || q.dx); q.dx = stripHash(q.dx);
          const cyc = parseCycle(q.short, base); q.cycle = cyc || null;
          q.anti = g('anti') ? g('anti').split(/[,，、]/).map(s => s.trim()).filter(Boolean).map(s => { const m = s.match(/^(.*?)\s*(\d+)\s*天?$/); return m ? {drug:m[1], holdDays:+m[2]} : {drug:s, holdDays:null}; }) : [];
          const extra = fillInfo.extra; if(extra){ if(extra.sex) q.sex = extra.sex; applyInfo(q, {exams:extra.exams, cultures:extra.cultures}); }
          if(q.attending && !S.attendings.includes(q.attending)) S.attendings.push(q.attending);
          if(isNew) location.hash = '#/';
        });
      };
    });
}

function infoSummary(i){
  const rows = [];
  if(i.short || i.dx) rows.push(['主診斷', (i.short && i.dx && i.short !== i.dx ? `${i.short}（${i.dx}）` : i.short || i.dx) + (i.opDate ? ` · 手術 ${md(i.opDate)}` : '')]);
  if(i.sex) rows.push(['性別', i.sex]);
  if(i.hx && i.hx.length) rows.push(['Underlying', i.hx.join('；')]);
  if(i.ipsa || i.pv || i.mri) rows.push(['前列腺', [i.ipsa && 'iPSA ' + i.ipsa, i.pv && 'PV ' + i.pv, i.mri && 'MRI ' + i.mri].filter(Boolean).join(' · ')]);
  if(i.anti && i.anti.length) rows.push(['抗凝', i.anti.map(a => a.drug + (a.holdDays ? ` 停 ${a.holdDays} 天` : '')).join('、')]);

  if(i.cultures && i.cultures.length) rows.push(['Culture', i.cultures.map(c => `${c.site}: ${c.org}`).join('；')]);
  if(i.note) rows.push(['備註', i.note]);

        const rs = (res.results||[]).filter(r => r.date).sort((a,b) => a.date.localeCompare(b.date));
        if(!rs.length){ status.textContent = '沒有找到檢驗數值'; return; }
        const last = rs[rs.length-1]; extra = rs.slice(0,-1);

      el.querySelector('[data-parse]').onclick = () => { const tx = el.querySelector('[data-pastetext]').value.trim(); if(tx) run([], tx); };

        const d2 = form.date.value || date;

function viewOR(){
  const att = S.settings.orFilter || '';
  const atts = attendingsForMonth(orMonth);
  const [y, m] = orMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), startOff = first.getDay();
  const start = new Date(y, m-1, 1 - startOff);
  const tmr = addDays(today(), 1);
  let html = `<div class="top"><h1>手術</h1><button class="ib" data-orpaste>貼上</button><button class="ib" data-oradd aria-label="新增手術">${ICON.plus}</button></div>`;
  if(atts.length) html += `<div class="seg">${['', ...atts].map(a => `<button data-orf="${esc(a)}" class="${a===att?'on':''}">${a?esc(a):'全部'}</button>`).join('')}</div>`;
  html += `<div class="mhead"><button class="ib" data-mon="-1">${ICON.back}</button><b>${y} 年 ${m} 月</b><button class="ib" data-mon="1">${ICON.fwd}</button></div><div class="mgrid">${[...WD].map(w => `<div class="wh">${w}</div>`).join('')}`;
  for(let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d);
    if(i >= 35 && d.getMonth() !== m-1) break;
    const list = surgeriesOn(k, att);
    const worst = list.length ? (list.some(s => surgState(s).color === 'late') ? 'late' : list.some(s => surgState(s).color === 'pend') ? 'pend' : 'ok') : '';
    html += `<button class="mcell ${d.getMonth()!==m-1?'out':''} ${k===today()?'today':''} ${k===orSel?'sel':''}" data-ord="${k}"><span class="n">${d.getDate()}</span>${list.length ? `<span class="c"><span class="dot ${worst}"></span>${list.length}</span>` : '<span class="c">&nbsp;</span>'}</button>`;
  }
  html += '</div><div class="wrap">';
  const tl = surgeriesOn(tmr, att);
  if(orSel !== tmr && tl.length){
    const pend = tl.filter(s => !surgState(s).complete).length;
    html += `<div class="remind" data-ord="${tmr}" style="cursor:pointer"><div class="h">明天 ${md(tmr)}（${wd(tmr)}）<span class="sp"></span>${tl.length} 台${pend ? ` · <span style="color:var(--amber)">${pend} 未完成</span>` : ' · 全部完成'}</div></div>`;
  }
  const list = surgeriesOn(orSel, att);
  html += `<div class="group">${md(orSel)}（${wd(orSel)}）${list.length ? ` · ${list.length} 台` : ''}</div>`;
  html += list.length ? `<div class="list">${list.map(s => { const st = surgState(s); return `<div class="surg" data-surg="${s.id}">
      <span class="room">${s.room ? 'OR' + esc(s.room) : '—'}</span>
      <div class="mid"><div class="p">${esc(s.proc)}${s.outpatient ? ' <span class="mk">門診</span>' : ''}${s.anti ? ` <span class="mk" style="color:var(--red);border-color:var(--red)">${esc(s.anti)}</span>` : ''}</div>
        <div class="s">${esc(s.name || '')} #${esc(s.mrn || '—')}${!att && s.attending ? ' · ' + esc(s.attending) : ''}</div></div>
      <span class="prog ${st.color}">${st.done}/${st.total}</span></div>`; }).join('')}</div>`
    : '<div class="empty-state">這天沒有手術<br><br><span data-oradd style="color:var(--accent);cursor:pointer">新增手術</span></div>';
  html += '</div>';
  $('#app').innerHTML = html;

function maybeAskMonth(){

function monthSetup(m){
  const prev = S.months[m] || Object.values(S.months).slice(-1)[0];
  let rows = prev ? prev.attendings.map(a => ({code:a.code, days:[...a.days]})) : S.attendings.slice(0, 2).map(code => ({code, days:[]}));
  if(!rows.length) rows = [{code:'', days:[]}];
  const draw = el => {
    el.querySelector('[data-rows]').innerHTML = rows.map((r,i) => `<div class="lrow" style="flex-wrap:wrap"><input class="t" style="width:110px" data-code="${i}" value="${esc(r.code)}" placeholder="MA5678">
      <div class="wdsel">${[1,2,3,4,5,6,0].map(w => `<button data-w="${i}:${w}" class="${r.days.includes(w)?'on':''}">${WD[w]}</button>`).join('')}</div><button class="xbtn" data-rm="${i}">×</button></div>`).join('');
  };
  sheet(`<h3>${+m.slice(5)} 月的主治<span class="sp"></span><button class="ib" data-close>稍後</button></h3>
    <div class="small muted">這個月跟哪些主治？點選他們的門診日，出院時會自動建議 RTC 日期。</div>
    <div data-rows style="margin-top:8px"></div>
    <div class="row2"><button class="btn sec sm" data-addrow>＋ 主治</button></div>
    <div class="row2"><button class="btn" data-ok>儲存</button></div>`, (el, close) => {
      draw(el);
      el.addEventListener('input', e => { if(e.target.dataset.code !== undefined) rows[+e.target.dataset.code].code = e.target.value.trim().toUpperCase(); });
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if(!b) return;
        if(b.dataset.w){ const [i, w] = b.dataset.w.split(':').map(Number); const ds = rows[i].days; rows[i].days = ds.includes(w) ? ds.filter(x => x !== w) : [...ds, w]; draw(el); }
        if(b.dataset.rm){ rows.splice(+b.dataset.rm, 1); draw(el); }
        if(b.hasAttribute('data-addrow')){ rows.push({code:'', days:[]}); draw(el); }
      });
      el.querySelector('[data-ok]').onclick = () => {
        const list = rows.filter(r => r.code);
        close();
        act(`已設定 ${+m.slice(5)} 月主治`, () => {
          S.months[m] = {attendings:list};
          S.attendings = [...list.map(r => r.code), ...S.attendings.filter(a => !list.some(r => r.code === a))];
        });
      };
    });
}

      <b>每位病人只在第一次出現那天整理一次</b>，之後 POD、Abx 天數、C#D# 都自動算。<br>
      在病人那一行和第一個藥之間打 1–3 行：<br>
      第 1 行 主診斷：<code>Lt RAPN POD2</code>、<code>Bladder UC · GC C3D1</code>、<code>Lt APN urosepsis Abx</code>、<code>AUR · post Foley</code>、<code>New Bladder UC · staging</code><br>
      第 2 行（選填）性別、病史：<code>70F, Hx: DM, CAD s/p PCI on aspirin</code>（多行 Underlying Hx 直接貼）<br>
      第 3 行（選填）已排檢查：<code>Chest CT 11/2 10am, bone scan 11/3 13:00</code>，培養：<code>U/C: E. coli</code><br>
      <b>只補一位新病人</b>請用病人頁右上角「＋」，不要只貼一段 TeamPro（不然同主治的其他病人會被判定出院）。<br>
      <b>預約入院</b>：<code>病歷號:6012345 姓名:王ＯＯ 11/4</code>（日期＝入院日），下一行寫 <code>RARP OP 11/5</code>。
      </div></details>` : `
    <label class="f">每段用床號開頭，補充到今天清單上的病人：</label>
    <textarea class="paste" id="supp" placeholder="3F21A Lt RAPN POD2&#10;3F13 Hx: CAD s/p PCI, on aspirin&#10;  DM, HTN&#10;8F20A U/C: E. coli"></textarea>
    <div class="row2"><button class="btn" id="suppparse">整理</button></div>
    <div id="preview"></div>`}</div>`;
  if(mode === 'teampro'){
    $('#clip').onclick = async () => { try{ $('#paste').value = await navigator.clipboard.readText(); }catch(e){ toast('無法讀取剪貼簿，請長按文字框貼上'); } };
    $('#parse').onclick = parseTeamProUI;
  } else $('#suppparse').onclick = parseSuppUI;
}
async function parseTeamProUI(){
  const parsed = parseTeamPro($('#paste').value);
  const prev = $('#preview');
  if(!parsed.pts.length && !parsed.pres.length){ prev.innerHTML = '<div class="card">找不到病人資料。請確認每位病人的第一行是「病歷號:… 姓名:… 年齡:… 床號 入院日期:…」。</div>'; return; }
  const withNotes = [...parsed.pts, ...parsed.pres].filter(q => noteText(q));
  let orgNote = '';
  if(withNotes.length && S.settings.apiKey){
    prev.innerHTML = `<div class="card small muted"><span class="spin"></span> Claude 正在整理 ${withNotes.length} 位病人的重點…</div>`;
    const r = await organize(withNotes.map(q => ({key:q.mrn, text:noteText(q)})));
    if(r.by === 'claude'){ for(const q of withNotes) if(r.info[q.mrn]) q.info = r.info[q.mrn]; orgNote = `<li>Claude 已整理 ${withNotes.length} 位病人的重點</li>`; }
    else orgNote = `<li class="faint">Claude 整理失敗，改用基本規則（${esc(r.err)}）</li>`;
  }
  const plan = planImport(parsed);
  pendingImport = parsed;
  const medChanged = parsed.pts.filter(q => { const p = S.patients[q.mrn]; if(!p || isReadmit(p, q)) return false; const base = p.medsDate && p.medsDate !== today() ? p.meds : p.medsPrev; return base && medDiffCount({medDiff:diffMeds(base, q.meds)}); });
  const byAtt = {}; for(const q of parsed.pts) byAtt[q.att || '未指定主治'] = (byAtt[q.att || '未指定主治'] || 0) + 1;
  const names = list => esc(list.map(q => q.name || q.mrn).join('、'));
  prev.innerHTML = `<div class="card"><h2>解析結果</h2><ul class="sum" style="padding-left:18px;margin:0">
    ${parsed.pts.length ? `<li>住院中 <b>${parsed.pts.length}</b> 位：${Object.entries(byAtt).map(([a,n]) => `${esc(a)} ${n} 位`).join('、')}</li>` : ''}
    ${plan.newOnes.length?`<li>新病人 ${plan.newOnes.length}：${names(plan.newOnes)}</li>`:''}
    ${plan.readmits.length?`<li>再次入院 ${plan.readmits.length}：${names(plan.readmits)}（保留上次的病史與 Lab）</li>`:''}
    ${plan.surgeries.length?`<li>帶入已排手術 ${plan.surgeries.length}：${names(plan.surgeries)}</li>`:''}
    ${orgNote || (plan.withInfo.length?`<li>帶入主診斷 ${plan.withInfo.length} 位</li>`:'')}
    ${plan.moved.length?`<li style="color:var(--amber)">換床 ${plan.moved.length}：${plan.moved.map(q => `${esc(q.name)} ${esc(bedShort(S.patients[q.mrn].bed))}→${esc(bedShort(q.bed))}`).join('、')}</li>`:''}
    ${medChanged.length?`<li>用藥有變動：${names(medChanged)}</li>`:''}
    ${parsed.pres.length?`<li>預約入院 ${parsed.pres.length} 位：${parsed.pres.map(q => `${esc(q.name || q.mrn)}${q.admDate?` ${md(q.admDate)}`:''}`).join('、')}</li>`:''}
    ${parsed.bad.length?`<li class="faint">有 ${parsed.bad.length} 行無法辨識，已略過</li>`:''}
  </ul>
  ${plan.merges.length ? `<h2 style="margin-top:12px">可能是同一位病人（勾選＝合併）</h2>${plan.merges.map((m,i) => `<label class="chk"><input type="checkbox" checked data-merge="${i}">手動新增的 ${esc(m.tmpName || '')} ${esc(bedShort(m.tmpBed))} ＝ ${esc(m.name)} #${esc(m.mrn)}</label>`).join('')}` : ''}
  ${plan.missing.length ? `<h2 style="margin-top:12px">將移到已出院（不在這次名單裡）</h2>
    <div class="small muted">取消勾選可以保留在清單上</div>
    ${plan.missing.map(p => `<label class="chk"><input type="checkbox" checked data-dc="${p.mrn}"> ${esc(bedShort(p.bed))} ${esc(p.name)} <span class="when">${esc(p.short||'')}</span></label>`).join('')}` : ''}
  <div class="row2"><button class="btn" id="confirm">確認匯入</button></div></div>`;
  $('#confirm').onclick = () => {
    const dc = [...document.querySelectorAll('[data-dc]:checked')].map(x => x.dataset.dc);
    const mg = [...document.querySelectorAll('[data-merge]:checked')].map(x => plan.merges[+x.dataset.merge]);
    const gone = dc.map(m => S.patients[m] && S.patients[m].name).filter(Boolean);
    selDate = today(); location.hash = '#/';
    act(gone.length ? `匯入完成，${gone.join('、')} 移到已出院` : '匯入完成', () => applyImport(pendingImport, dc, mg));
    pendingImport = null;
  };
}
async function parseSuppUI(){
  const groups = parseSupplement($('#supp').value);
  const prev = $('#preview');
  if(!groups.length){ prev.innerHTML = '<div class="card small">每段要用床號開頭，例如 <code>3F21A Lt RAPN POD2</code></div>'; return; }
  const ok = groups.filter(g => g.patient);
  prev.innerHTML = `<div class="card small muted">${S.settings.apiKey ? '<span class="spin"></span> 整理中…' : ''}</div>`;
  const r = await organize(ok.map(g => ({key:g.patient.mrn, text:g.lines.join('\n')})));
  prev.innerHTML = `<div class="card">${groups.map(g => g.patient ? `<div style="margin-bottom:8px"><b>${esc(bedShort(g.patient.bed))} ${esc(g.patient.name)}</b>${infoSummary(r.info[g.patient.mrn] || {})}</div>` : `<div class="faint" style="margin-bottom:8px">${esc(g.bed)}：今天清單上找不到這床</div>`).join('')}
    ${r.err ? `<div class="faint small">Claude 整理失敗，改用基本規則（${esc(r.err)}）</div>` : ''}
    <div class="row2"><button class="btn" id="suppok" ${ok.length?'':'disabled'}>套用</button></div></div>`;
  $('#suppok').onclick = () => act(`已補充 ${ok.length} 位病人`, () => { for(const g of ok) if(r.info[g.patient.mrn]) mergeInfo(S.patients[g.patient.mrn], r.info[g.patient.mrn]); });
}

// ================= settings =================
async function backup(){
  const t = today();
  const json = JSON.stringify(S);
  const name = `查房備份-${t}.json`;
  const done = () => { S.settings.lastBackup = t; save(); render(); toast('已備份'); };
  try{
    const file = new File([json], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'查房備份'}); return done(); }
  }catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'})); a.download = name; a.click();
  done();
}
function viewSettings(){
  const archived = Object.values(S.patients).filter(p => !isPending(p) && !admittedNow(p)).sort((a,b) => (b.dischargedOn||'').localeCompare(a.dischargedOn||''));
  const m = today().slice(0,7), conf = S.months[m];
  const st = S.settings;
  $('#app').innerHTML = `<div class="top"><h1>設定</h1></div><div class="wrap">
    <div class="card"><h2>本月主治與門診日<span class="sp"></span><button data-month>設定</button></h2>
      ${conf && conf.attendings.length ? conf.attendings.map(a => `<div class="lrow"><span class="grow">${esc(a.code)}</span><span class="muted small">${a.days.length ? '門診 ' + a.days.map(w => '週' + WD[w]).join('、') : '未設定門診日'}</span></div>`).join('') : '<div class="faint small">尚未設定</div>'}</div>
    <div class="card"><h2>備份到 iCloud Drive</h2>
      <div class="small muted">資料只存在這支手機的主畫面 App 裡。按「備份」→ 選「儲存到檔案」→ iCloud Drive，MacBook 的 iCloud Drive 就看得到備份檔。${st.lastBackup ? `上次備份：${md(st.lastBackup)}` : '還沒有備份過。'}</div>
      <div class="row2"><button class="btn" data-backup>備份</button><label class="btn sec" style="text-align:center">從備份還原<input type="file" accept="application/json,.json" hidden id="restorefile"></label></div></div>
    <div class="card"><h2>Claude API key</h2>
      <input class="t" type="password" id="key" value="${esc(st.apiKey)}" placeholder="sk-ant-…" autocomplete="off">
      <div class="small muted" style="margin-top:6px">用於照片判讀與整理病史，只存在這支手機上。</div>
      <div class="row2"><button class="btn" id="savekey">儲存</button></div></div>
    <div class="card"><h2>術式選項</h2>
      <div class="chips">${st.procedures.map((p,i) => `<button data-delproc="${i}">${esc(p)} ×</button>`).join('')}</div>
      <div class="inl"><input id="newproc" placeholder="新增術式"><button class="btn sm" id="addproc">加入</button></div></div>
    <div class="card"><h2>開刀房（點選切換是否可排達文西）</h2>
      <div class="chips">${st.rooms.map(r => `<button data-robot="${esc(r)}" class="${st.robotRooms.includes(r)?'on':''}">${esc(r)}${st.robotRooms.includes(r)?' 達文西':''}</button>`).join('')}</div>
      <div class="inl"><input id="newroom" inputmode="numeric" placeholder="新增房號"><button class="btn sm" id="addroom">加入</button><button class="btn sm sec" id="delroom">刪除</button></div></div>
    <div class="card"><h2>術前準備清單範本（期限 OP 前 ${PREOP_DAYS} 天）</h2>
      ${st.checklist.map((c,i) => `<div class="lrow"><input class="t grow" data-cl="${i}" value="${esc(c.label)}"><select class="t" style="width:96px" data-clw="${i}">${[['all','全部'],['outpatient','門診手術'],['anti','有抗凝']].map(([k,l]) => `<option value="${k}" ${c.when===k?'selected':''}>${l}</option>`).join('')}</select><button class="xbtn" data-cldel="${i}">×</button></div>`).join('')}
      <div class="row2"><button class="btn sec sm" id="cladd">＋ 項目</button></div></div>
    <div class="card"><h2>病人頁版面<span class="sp"></span><button data-layout>編輯</button></h2></div>
    <div class="card"><h2>最近操作（這次開啟期間）</h2>
      ${UNDO.length ? UNDO.map((u,i) => `<div class="lrow"><span class="grow">${esc(u.label)} <span class="faint small">${u.at.getHours()}:${pad(u.at.getMinutes())}</span></span><button class="ib" data-undo="${i}">復原到這之前</button></div>`).join('') : '<div class="faint small">無</div>'}</div>
    <div class="card"><h2>已出院（${archived.length}）</h2>
      ${archived.slice(0,40).map(p => `<div class="lrow"><span class="grow">${esc(p.name)} <span class="muted small">${esc(p.short || (p.history&&p.history[0]&&p.history[0].dx) || '')} · ${md(p.dischargedOn)}</span></span><button class="ib" data-restore="${p.mrn}">恢復</button><button class="ib" style="color:var(--red)" data-purge="${p.mrn}">刪除</button></div>`).join('') || '<div class="faint small">無</div>'}</div>
    <div class="card"><div class="row2" style="margin-top:0"><button class="btn danger" id="wipe">清除全部資料</button></div></div>
  </div>`;
  $('#savekey').onclick = () => { st.apiKey = $('#key').value.trim(); save(); toast('已儲存'); };
  $('#addproc').onclick = () => { const v = $('#newproc').value.trim(); if(v && !st.procedures.includes(v)) act('已新增術式', () => st.procedures.push(v), {toast:false}); };
  $('#addroom').onclick = () => { const v = $('#newroom').value.trim(); if(v && !st.rooms.includes(v)) act('已新增開刀房', () => st.rooms.push(v), {toast:false}); };
  $('#delroom').onclick = () => { const v = $('#newroom').value.trim(); if(st.rooms.includes(v)) act('已刪除開刀房', () => { st.rooms = st.rooms.filter(r => r !== v); st.robotRooms = st.robotRooms.filter(r => r !== v); }); };
  $('#cladd').onclick = () => act('已新增項目', () => st.checklist.push({id:uid(), label:'新項目', when:'all'}), {toast:false});
  $('#app').onchange = e => {
    if(e.target.dataset.cl !== undefined){ st.checklist[+e.target.dataset.cl].label = e.target.value.trim() || '未命名'; save(); }
    if(e.target.dataset.clw !== undefined){ st.checklist[+e.target.dataset.clw].when = e.target.value; save(); }
  };
  $('#app').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const ds = b.dataset;
    if(ds.month !== undefined) monthSetup(m);
    if(ds.layout !== undefined) layoutSheet();
    if(ds.delproc) act('已刪除術式', () => st.procedures.splice(+ds.delproc, 1));
    if(ds.robot) { const r = ds.robot; st.robotRooms = st.robotRooms.includes(r) ? st.robotRooms.filter(x => x !== r) : [...st.robotRooms, r]; save(); render(); }
    if(ds.cldel) act('已刪除項目', () => st.checklist.splice(+ds.cldel, 1));
    if(ds.undo) undoAt(+ds.undo);
    if(ds.restore) act('已恢復', () => { const p = S.patients[ds.restore]; if(!p.adm && p.history && p.history.length){ const h = p.history.shift(); Object.assign(p, {adm:h.adm, dx:h.dx, short:h.dx, opDate:h.opDate}); } p.dischargedOn = null; });
    if(ds.purge && confirm('永久刪除這位病人的所有資料？')) act('已刪除病人', () => { delete S.patients[ds.purge]; });
  };
  $('#restorefile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ const s = JSON.parse(await f.text()); if(!s.patients) throw new Error('格式不符'); if(confirm('用備份取代目前所有資料？')) act('已從備份還原', () => { const key = S.settings.apiKey; S = migrate(s); if(!S.settings.apiKey) S.settings.apiKey = key; }); }
    catch(err){ toast('還原失敗：' + err.message); }
  };
  $('#wipe').onclick = () => { if(confirm('清除全部資料？清除後仍可以在「最近操作」復原，直到關閉 App。')) act('已清除全部資料', () => { const key = S.settings.apiKey; S = emptyState(); S.settings.apiKey = key; }); };
}

// ================= router & global events =================
function render(){
  const h = location.hash.replace(/^#\/?/, '');
  const [route, arg] = h.split('/');
  $('#app').onclick = null; $('#app').onchange = null; $('#app').oninput = null;
  openRow = null;
  if(route === 'p') viewDetail(decodeURIComponent(arg||''));
  else if(route === 'or') viewOR();
  else if(route === 'import') viewImport();
  else if(route === 'settings') viewSettings();
  else viewList();
  tabbar(route || '');
}
const curPatient = () => S.patients[decodeURIComponent(location.hash.split('/')[2] || '')];
document.addEventListener('click', e => {
  const rm = e.target.closest('[data-remove]'); if(rm){ const p = S.patients[rm.dataset.remove]; if(p) removeFromList(p, selDate); return; }
  const go = e.target.closest('[data-go]');
  if(go){
    const row = go.closest('.row');
    if(row && row.dataset.swiped) return;
    if(row && openRow){ closeRow(openRow); openRow = null; return; }
    location.hash = '#/p/' + go.dataset.go; window.scrollTo(0,0); return;
  }
  const sg = e.target.closest('[data-surg]'); if(sg){ const s = S.surgeries[sg.dataset.surg]; if(s) surgeryForm(s); return; }
  if(e.target.closest('[data-backup]')){ backup(); return; }
  const day = e.target.closest('[data-date]'); if(day && !e.target.closest('#app [data-act]')){ selDate = day.dataset.date; render(); return; }
  const ord = e.target.closest('[data-ord]'); if(ord){ orSel = ord.dataset.ord; orMonth = orSel.slice(0,7); render(); return; }
  const mon = e.target.closest('[data-mon]'); if(mon){ const [y, m] = orMonth.split('-').map(Number); const d = new Date(y, m - 1 + +mon.dataset.mon, 1); orMonth = ymd(d).slice(0,7); render(); return; }
  const orf = e.target.closest('[data-orf]'); if(orf){ S.settings.orFilter = orf.dataset.orf; save(); render(); return; }
  if(e.target.closest('[data-oradd]')){ surgeryForm(null); return; }
  if(e.target.closest('[data-orpaste]')){ orPasteSheet(); return; }
  const im = e.target.closest('[data-imode]'); if(im){ S.settings.importMode = im.dataset.imode; save(); render(); return; }
  if(e.target.closest('[data-add]')){ editPatient(null); return; }
  if(e.target.closest('[data-back]')){ location.hash = '#/'; return; }
  const f = e.target.closest('[data-filter]'); if(f){ S.settings.filter = f.dataset.filter; save(); render(); return; }
  const due = e.target.closest('[data-due]');
  if(due){ const p = curPatient(); const x = p && p.todos.find(x => x.id === due.dataset.due); if(x) pickDate('提醒日期', x.due || addDays(today(),1), d => { x.due = d; save(); render(); }); return; }
  const del = e.target.closest('[data-deltodo]');
  if(del){ const p = curPatient(); if(p) act('已刪除 order', () => { p.todos = p.todos.filter(x => x.id !== del.dataset.deltodo); }); }
});
document.addEventListener('change', e => {
  const cb = e.target.closest('[data-todo]'); if(!cb) return;
  const p = curPatient(); if(!p) return;
  const x = p.todos.find(x => x.id === cb.dataset.todo); if(!x) return;
  x.done = cb.checked; x.doneOn = cb.checked ? selDate : null;
  save(); render();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="todo"]'); if(!f) return;
  e.preventDefault();
  const p = curPatient(); const t = f.t.value.trim();
  if(p && t) placeOrder(p, 'text', {text:t});
});
window.addEventListener('hashchange', render);
let lastDay = today();
document.addEventListener('visibilitychange', () => {   // new day while the app was in the background: jump to today
  if(document.hidden) return;
  if(today() !== lastDay){ lastDay = today(); selDate = lastDay; orSel = lastDay; }
  render();
});
render();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
